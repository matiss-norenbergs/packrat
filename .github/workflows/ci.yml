name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Not gofmt-formatted:"
            echo "$files"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -timeout 20m ./...

  # Dependency/stdlib vulnerability scan. Fails the job when govulncheck reports vulnerabilities
  # that affect the code (exit status 3); the report is also written to the job summary and an
  # annotation. Any other failure (the scan could not complete, e.g. vuln.go.dev is unreachable)
  # only warns, so an outage of the vulnerability database cannot block every PR.
  # Adding the job to the required checks is branch protection, configured outside the repo.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        env:
          GOVULNCHECK_VERSION: v1.10.0
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          status=0
          "$(go env GOPATH)/bin/govulncheck" ./... 2>&1 | tee govulncheck.txt || status=${PIPESTATUS[0]}
          {
            echo "## govulncheck"
            echo
            echo "Go $(go env GOVERSION), govulncheck ${GOVULNCHECK_VERSION}, exit code ${status}"
            echo
            echo '```'
            cat govulncheck.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -eq 3 ]; then
            echo "::error title=govulncheck::Vulnerabilities found. See the job summary."
            exit 1
          elif [ "$status" -ne 0 ]; then
            # Not a finding: the scan itself failed (database unreachable, build error, ...).
            # Warn but pass, so an outage of vuln.go.dev cannot block every PR.
            echo "::warning title=govulncheck::govulncheck did not complete (exit code ${status}). See the job summary."
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Ratchet: --max-warnings in package.json only ever goes down.
      - run: npm run lint
      # Every eslint/oxlint-disable directive must say why (` -- reason`).
      - run: npm run check:disables
      # src/lib (non-test) compiled with noUncheckedIndexedAccess; see tsconfig.lib-strict.json.
      - run: npm run typecheck:lib
      - run: npx tsc -b
      - run: npm run test
      - run: npm run build
      # Fails if an on-demand chunk (charts, page-only libraries, Tauri plugins) lands on the startup path.
      - run: npm run check:bundle
      # Runtime dependencies only: the build tooling (shadcn, tailwind...) is in devDependencies.
      - run: npm audit --omit=dev --audit-level=high

  # The Tauri desktop shell (desktop/). Linux only here: it checks the Rust compiles and its tests
  # pass; the installers for every OS are built by desktop.yml at release time.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux dependencies
        timeout-minutes: 10
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/apt-install.sh" \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri::generate_context! needs the built frontend to embed.
      - run: npm ci && npm run build
        working-directory: frontend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The release's update-manifest generator (desktop/scripts).
      - run: node --test scripts/*.test.mjs
        working-directory: desktop

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Authenticated Docker Hub pulls for the Dockerfile's base images —
      # anonymous pulls from shared runner IPs hit the rate limit (429).
      # Skipped on fork PRs and Dependabot PRs, which don't get repository secrets
      # (Dependabot has its own separate secret store).
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - run: docker build -f docker/Dockerfile -t packrat:ci .
