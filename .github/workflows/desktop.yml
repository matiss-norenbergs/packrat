name: Desktop

# Builds the Tauri desktop client (desktop/) for Linux, Windows and macOS (Apple silicon + Intel).
# Called by release.yml after the Docker image is published, so the installers are attached to the
# same GitHub Release; can also be run by hand to get the installers as workflow artifacts without
# releasing anything. The installers are not code-signed (see desktop/README.md), but the update
# files are signed with the Tauri updater key (the TAURI_SIGNING_PRIVATE_KEY secret) and listed in
# a latest.json manifest, which is what the app's "Check for updates" button reads.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to build, MAJOR.MINOR.PATCH without the leading v"
        required: true
        type: string
      publish:
        description: "Attach the installers to the v<version> GitHub Release"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the installers with, MAJOR.MINOR.PATCH (a dry run is not published)"
        required: false
        type: string
        default: "0.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not MAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      # The installer version comes from tauri.conf.json, so stamp the release version into it.
      - name: Set version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop

      # `tauri build` runs the frontend's production build itself (beforeBuildCommand). The updater
      # artifacts (and their signatures) are only requested here, so a local `npm run build` works
      # without the private key.
      - name: Build installers
        shell: bash
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "The TAURI_SIGNING_PRIVATE_KEY secret is not available to this run." >&2
            exit 1
          fi
          args=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          if [ -n "${{ matrix.target }}" ]; then
            args+=(--target "${{ matrix.target }}")
          fi
          npm run build -- "${args[@]}"

      # Gathers what a release needs into one flat folder: the installers people download, plus the
      # one signed file per platform the updater uses. (Tauri names both macOS update tarballs
      # "Packrat.app.tar.gz", so they get their architecture here.)
      - name: Collect installers
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          b=desktop/src-tauri/target
          mkdir -p out
          case "$RUNNER_OS" in
            Linux)
              cp $b/release/bundle/deb/*.deb $b/release/bundle/rpm/*.rpm \
                 $b/release/bundle/appimage/*.AppImage $b/release/bundle/appimage/*.AppImage.sig out/ ;;
            Windows)
              cp $b/release/bundle/msi/*.msi $b/release/bundle/nsis/*.exe $b/release/bundle/nsis/*.exe.sig out/ ;;
            macOS)
              cp $b/*/release/bundle/dmg/*.dmg out/
              cp $b/*/release/bundle/macos/Packrat.app.tar.gz "out/Packrat_${VERSION}_${ARCH}.app.tar.gz"
              cp $b/*/release/bundle/macos/Packrat.app.tar.gz.sig "out/Packrat_${VERSION}_${ARCH}.app.tar.gz.sig" ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@v6
        with:
          name: packrat-desktop-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 14

  # Builds the update manifest from every platform's files — on a dry run too, so a naming
  # problem shows up before a release — and, when publishing, attaches everything to the release
  # in one go, so the matrix legs don't race to update it.
  package:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: packrat-desktop-*
          merge-multiple: true

      - name: Build the update manifest
        env:
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: node desktop/scripts/update-manifest.mjs installers "$VERSION" "$REPO"

      - run: ls -l installers && cat installers/latest.json

      - uses: actions/upload-artifact@v6
        with:
          name: update-manifest
          path: installers/latest.json
          retention-days: 14

      - uses: softprops/action-gh-release@v3
        if: inputs.publish
        with:
          tag_name: v${{ inputs.version }}
          files: installers/*
