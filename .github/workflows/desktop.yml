name: Desktop

# Builds the Tauri desktop client (desktop/) for Linux, Windows and macOS (Apple silicon + Intel).
# Called by release.yml after the Docker image is published, so the installers are attached to the
# same GitHub Release; can also be run by hand to get the installers as workflow artifacts without
# releasing anything. The bundles are unsigned (see desktop/README.md).
on:
  workflow_call:
    inputs:
      version:
        description: "Version to build, MAJOR.MINOR.PATCH without the leading v"
        required: true
        type: string
      publish:
        description: "Attach the installers to the v<version> GitHub Release"
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the installers with, MAJOR.MINOR.PATCH (a dry run is not published)"
        required: false
        type: string
        default: "0.0.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-latest
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version '$VERSION' is not MAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      # The installer version comes from tauri.conf.json, so stamp the release version into it.
      - name: Set version
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const p = "desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '

      - run: npm ci
        working-directory: frontend
      - run: npm ci
        working-directory: desktop

      # `tauri build` runs the frontend's production build itself (beforeBuildCommand).
      - name: Build installers
        shell: bash
        working-directory: desktop
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run build -- --target "${{ matrix.target }}"
          else
            npm run build
          fi

      # Native installers only — not the raw binary or intermediate build directories.
      - uses: actions/upload-artifact@v6
        with:
          name: packrat-desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/*/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # One job attaches everything to the release, so the matrix legs don't race to update it.
  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: packrat-desktop-*
          merge-multiple: true

      - run: ls -R installers

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: installers/*
