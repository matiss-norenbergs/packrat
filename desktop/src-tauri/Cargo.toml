[package]
name = "packrat-desktop"
version = "0.1.0"
description = "Tauri shell for the Packrat frontend"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# The tray is only usable when something on the session bus shows indicators (see tray::is_available).
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

# Linux/macOS use the autostart plugin; Windows writes its own quoted `Run` value (autostart.rs).
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows-result = "0.100"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
